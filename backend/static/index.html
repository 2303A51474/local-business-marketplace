<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Business Marketplace & Service Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#6366f1;--pri2:#8b5cf6;--pink:#ec4899;--bg:#f3f4fb;--card:#fff;--txt:#1e2235;--mut:#6b7280;--bd:#e8eaf3;--ok:#16a34a;--bad:#dc2626;--sh:0 8px 30px rgba(79,70,229,.10)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--txt);background:var(--bg);
 background-image:radial-gradient(circle at 12% 8%,rgba(99,102,241,.14),transparent 40%),radial-gradient(circle at 92% 90%,rgba(236,72,153,.12),transparent 38%)}
h1,h2,h3,.brand{font-family:Poppins,Inter,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.brand{font-size:19px;font-weight:700;background:linear-gradient(90deg,var(--pri),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
#who{font-size:14px;color:var(--mut)}#who button{margin-left:8px}
.layout{display:flex;min-height:calc(100vh - 56px)}
nav{width:220px;background:linear-gradient(180deg,#1e1b4b,#312e81 60%,#4c1d95);padding:14px 10px;flex-shrink:0}
nav a{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:10px;color:#c7c9f5;text-decoration:none;cursor:pointer;margin-bottom:4px;font-weight:500;transition:.2s}
nav a:hover{background:rgba(255,255,255,.1);color:#fff}
nav a.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.45)}
main{flex:1;padding:24px;min-width:0}h2{margin:0 0 16px;font-size:24px}h3{margin:0 0 12px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:var(--sh)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{border-radius:16px;padding:16px 18px;color:#fff;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat:nth-child(4n+1){background:linear-gradient(135deg,#6366f1,#8b5cf6)}.stat:nth-child(4n+2){background:linear-gradient(135deg,#ec4899,#f43f5e)}
.stat:nth-child(4n+3){background:linear-gradient(135deg,#14b8a6,#0ea5e9)}.stat:nth-child(4n){background:linear-gradient(135deg,#f59e0b,#f97316)}
.stat small{opacity:.9;font-weight:500}.stat div{font-family:Poppins;font-size:28px;font-weight:700;margin-top:4px}
.stat:after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.18)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
form.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
label{font-size:13px;color:var(--mut);font-weight:500;display:block}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;margin-top:4px;background:#fff;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px rgba(99,102,241,.15)}
button{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;transition:.2s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(99,102,241,.35)}
button.s{padding:5px 10px;font-size:13px;margin:2px;border-radius:8px}
button.g{background:linear-gradient(90deg,#16a34a,#22c55e)}button.r{background:linear-gradient(90deg,#dc2626,#f43f5e)}
button.o{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:#f7f7fd;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:hover td{background:#fafaff}
.b{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:#e5e7eb;text-transform:capitalize}
.verified,.confirmed,.paid,.completed,.success{background:#dcfce7;color:#166534}.pending,.unpaid{background:#fef3c7;color:#92400e}.rejected,.cancelled{background:#fee2e2;color:#991b1b}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}.bar span{width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:14px;background:linear-gradient(90deg,var(--pri),var(--pink));border-radius:99px;transition:width .6s}
#toast{position:fixed;bottom:20px;right:20px;padding:13px 18px;border-radius:12px;color:#fff;display:none;z-index:99;max-width:80vw;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500}
.mut{color:var(--mut);font-size:13px}.bar-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
body.auth header{display:none}body.auth .layout{min-height:100vh}
body.auth{background:linear-gradient(120deg,#312e81,#6d28d9,#be185d,#0f766e);background-size:300% 300%;animation:flow 14s ease infinite}
@keyframes flow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
body.auth:before,body.auth:after{content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;animation:float 9s ease-in-out infinite}
body.auth:before{width:380px;height:380px;background:#f472b6;top:-90px;left:-90px}
body.auth:after{width:420px;height:420px;background:#22d3ee;bottom:-120px;right:-100px;animation-delay:-4s}
@keyframes float{50%{transform:translate(40px,30px)}}
body.auth main{display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.authbox{display:grid;grid-template-columns:1.1fr 1fr;width:min(980px,100%);background:rgba(255,255,255,.96);border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.hero{background:linear-gradient(160deg,#4338ca,#7c3aed 55%,#db2777);color:#fff;padding:36px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.hero h1{font-size:30px;line-height:1.2;margin:14px 0 8px}.hero p{opacity:.92;margin:0 0 6px}
.hero svg{width:100%;height:auto;max-height:260px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{background:rgba(255,255,255,.18);padding:5px 12px;border-radius:99px;font-size:12px}
.formside{padding:40px 38px}.formside h2{font-size:26px;margin-bottom:4px}.formside label{margin-bottom:12px}.formside button{width:100%;margin-top:6px;padding:12px}
.formside .alt{background:none;color:var(--pri);box-shadow:none;margin-top:10px}.demo{background:#f5f3ff;border-radius:12px;padding:10px 12px;font-size:12px;color:#5b21b6;margin-top:14px;line-height:1.7}
@media(max-width:820px){.authbox{grid-template-columns:1fr}.hero{display:none}.formside{padding:28px 22px}.layout{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:8px}nav a{white-space:nowrap;margin:0 3px}}
@media print{header,nav,.noprint{display:none!important}main{padding:0}body{background:#fff}}
</style>
</head>
<body>
<header><span class="brand">🏪 Local Business Marketplace</span><span id="who"></span></header>
<div class="layout"><nav id="nav" style="display:none"></nav><main id="main"></main></div>
<div id="toast"></div>
<script>
let token = localStorage.getItem('tok'), user = JSON.parse(localStorage.getItem('usr') || 'null');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = s => `<span class="b ${esc(s)}">${esc(s)}</span>`;
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
function toast(m, ok = true){const t=$('#toast');t.textContent=m;t.style.background=ok?'#16a34a':'#dc2626';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
async function api(p, m = 'GET', b, raw){
  const r = await fetch('/api' + p, {method:m, headers:{'Content-Type':'application/json', ...(token ? {Authorization:'Bearer ' + token} : {})}, body:b ? JSON.stringify(b) : undefined});
  if (raw && r.ok) return r;
  let d = {}; try { d = await r.json() } catch(e) {}
  if (r.status === 401 && token && !p.startsWith('/auth')) { logout(); throw new Error('Session expired. Please login again.') }
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}
const act = fn => async (...a) => { try { await fn(...a) } catch(e) { toast(e.message, false) } };
const table = (cols, rows) => !rows.length ? '<p class="mut">No records found.</p>' :
  `<div class="tw"><table><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr>${rows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const bars = d => { const k = Object.keys(d), m = Math.max(1, ...Object.values(d)); return k.length ? k.map(x => `<div class="bar"><span title="${esc(x)}">${esc(x)}</span><i style="width:${d[x] / m * 55}%"></i><b>${d[x]}</b></div>`).join('') : '<p class="mut">No data yet.</p>' };

const ICON = {dashboard:'📊',businesses:'🏬',services:'🛎️',bookings:'📅',payments:'💳',reviews:'⭐',reports:'📑',users:'👥'};
const MENUS = {
  admin:[['dashboard','Dashboard'],['businesses','Businesses'],['services','Services'],['bookings','Bookings'],['payments','Payments'],['reviews','Feedback'],['reports','Reports'],['users','Users']],
  owner:[['dashboard','Dashboard'],['businesses','My Businesses'],['services','My Services'],['bookings','Bookings'],['payments','Payments'],['reviews','Feedback'],['reports','Reports']],
  provider:[['dashboard','Dashboard'],['bookings','My Jobs'],['reviews','Feedback']],
  customer:[['dashboard','Dashboard'],['services','Find Services'],['bookings','My Bookings'],['payments','Payments'],['reviews','My Reviews']]
};

function logout(){ token = null; user = null; localStorage.clear(); start() }
function go(v){ location.hash = v }
window.onhashchange = () => user && show((location.hash || '#dashboard').slice(1));

function start(){
  document.body.classList.toggle('auth', !(token && user));
  if (!token || !user) {
    $('#nav').style.display = 'none'; $('#who').innerHTML = '';
    return authScreen('login');
  }
  $('#who').innerHTML = `${esc(user.name)} (${esc(user.role)}) <button class="s o" onclick="logout()">Logout</button>`;
  $('#nav').style.display = '';
  window.onhashchange();
  if (!location.hash) go('dashboard');
}

function authScreen(mode){
  const reg = mode === 'register';
  document.body.classList.add('auth');
  $('#main').innerHTML = `<div class="authbox"><div class="hero"><div><div class="chips"><span>🏪 Verified businesses</span><span>📅 Easy booking</span><span>⭐ Real reviews</span></div>
  <h1>Find &amp; book trusted local services</h1><p>Salons, home repairs, tuition and more, all in one place near you.</p></div><svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="210" cy="228" rx="190" ry="14" fill="rgba(0,0,0,.18)"/><g><rect x="30" y="90" width="110" height="130" rx="8" fill="#fff"/><path d="M24 90h122l-10-34H34z" fill="#f472b6"/><rect x="48" y="130" width="34" height="90" rx="4" fill="#6366f1"/><rect x="92" y="118" width="36" height="34" rx="4" fill="#a5f3fc"/></g><g><rect x="160" y="60" width="120" height="160" rx="8" fill="#fff"/><path d="M154 60h132l-10-36H164z" fill="#22d3ee"/><rect x="178" y="110" width="40" height="110" rx="4" fill="#8b5cf6"/><rect x="228" y="100" width="40" height="40" rx="4" fill="#fde68a"/><circle cx="250" cy="170" r="14" fill="#fecdd3"/></g><g><rect x="300" y="100" width="95" height="120" rx="8" fill="#fff"/><path d="M294 100h107l-9-30H303z" fill="#fbbf24"/><rect x="316" y="142" width="30" height="78" rx="4" fill="#ec4899"/><rect x="354" y="130" width="30" height="30" rx="4" fill="#bae6fd"/></g><g transform="translate(250 8)"><rect width="150" height="64" rx="14" fill="#fff"/><rect x="14" y="14" width="22" height="22" rx="6" fill="#6366f1"/><path d="M20 25l5 5 8-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="16" width="80" height="8" rx="4" fill="#c7d2fe"/><rect x="46" y="32" width="56" height="8" rx="4" fill="#e5e7eb"/><text x="14" y="55" font-size="10" fill="#16a34a" font-family="Arial" font-weight="700">Booking confirmed</text></g></svg></div>
  <div class="formside"><h2>${reg ? 'Create your account' : 'Welcome back 👋'}</h2><p class="mut" style="margin-top:0">${reg ? 'Join the marketplace in a minute.' : 'Login to continue to your dashboard.'}</p>
  <form id="af">${reg ? '<label>Full name<input name="name" required placeholder="Your name"></label>' : ''}
  <label>Email<input name="email" type="email" required placeholder="you@example.com"></label>
  <label>Password<input name="password" type="password" minlength="6" required placeholder="Min 6 characters"></label>
  ${reg ? '<label>I am a<select name="role"><option value="customer">Customer</option><option value="owner">Business Owner</option><option value="provider">Service Provider</option></select></label>' : ''}
  <button>${reg ? 'Register' : 'Login'}</button><button type="button" class="alt" onclick="authScreen('${reg ? 'login' : 'register'}')">${reg ? 'Already have an account? Login' : 'New here? Create an account'}</button></form>
  ${reg ? '' : '<div class="demo"><b>Demo logins</b><br>admin@demo.com / admin123<br>owner@demo.com / owner123<br>provider@demo.com / provider123<br>customer@demo.com / customer123</div>'}</div></div>`;
  $('#af').onsubmit = act(async e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
    if (reg) { await api('/auth/register', 'POST', d); toast('Registered! Please login.'); authScreen('login') }
    else { const r = await api('/auth/login', 'POST', d); token = r.token; user = r.user; localStorage.setItem('tok', token); localStorage.setItem('usr', JSON.stringify(user)); location.hash = 'dashboard'; start() }
  });
}

async function show(v){
  const menu = MENUS[user.role]; if (!menu.some(m => m[0] === v)) v = 'dashboard';
  $('#nav').innerHTML = menu.map(m => `<a class="${m[0] === v ? 'on' : ''}" onclick="go('${m[0]}')"><span>${ICON[m[0]]}</span>${m[1]}</a>`).join('');
  try { $('#main').innerHTML = await VIEWS[v]() } catch(e) { $('#main').innerHTML = `<div class="card">Error: ${esc(e.message)}</div>`; return }
  if (AFTER[v]) AFTER[v]();
}
const reload = () => show((location.hash || '#dashboard').slice(1));

const VIEWS = {
  async dashboard(){
    const d = await api('/dashboard');
    return `<h2>Dashboard</h2><div class="cards">${Object.entries(d.cards).map(([k, v]) => `<div class="stat"><small>${k}</small><div>${/Revenue|Spent/.test(k) ? money(v) : v}</div></div>`).join('')}</div>
    <div class="grid2"><div class="card"><h3>${d.chart.title}</h3>${bars(d.chart.data)}</div>${user.role === 'customer' || user.role === 'provider' ? '' : `<div class="card"><h3>${d.chart2.title}</h3>${bars(d.chart2.data)}</div>`}</div>
    <div class="card"><h3>Recent bookings</h3>${table([['ID', r => r.id], ['Service', r => esc(r.service_name)], ['Customer', r => esc(r.customer_name)], ['Date', r => r.date + ' ' + r.time], ['Status', r => badge(r.status)]], d.recent)}</div>`;
  },
  async businesses(){
    const rows = await api('/businesses'); const r = user.role;
    const form = r === 'owner' ? `<div class="card"><h3>Register a business</h3><form class="row" id="bf"><label>Name<input name="name" required></label>
      <label>Category<input name="category" list="cats" required><datalist id="cats"><option>Beauty<option>Home Repair<option>Education<option>Health<option>Food<option>Fitness</datalist></label>
      <label>Location<input name="location" required></label><label>Description<input name="description"></label><button>Register</button></form></div>` : '';
    const cols = [['ID', x => x.id], ['Business', x => esc(x.name)], ['Category', x => esc(x.category)], ['Location', x => esc(x.location)], ['Owner', x => esc(x.owner_name)], ['Status', x => badge(x.status)]];
    if (r === 'admin') cols.push(['Action', x => `<button class="s g" onclick="setBiz(${x.id},'verified')">Verify</button><button class="s r" onclick="setBiz(${x.id},'rejected')">Reject</button>`]);
    return `<h2>${r === 'owner' ? 'My Businesses' : 'Businesses'}</h2>${form}<div class="card">${table(cols, rows)}</div>`;
  },
  async services(){
    const r = user.role, p = new URLSearchParams(window.svcQ || {});
    const rows = await api('/services?' + p);
    let top = '';
    if (r === 'customer') {
      top = `<div class="card"><form class="row" id="sf"><label>Search<input name="q" value="${esc((window.svcQ || {}).q)}"></label><label>Category<input name="category" value="${esc((window.svcQ || {}).category)}"></label>
        <label>Location<input name="location" value="${esc((window.svcQ || {}).location)}"></label><button>Search</button></form></div><div id="bk"></div>`;
    }
    if (r === 'owner') {
      const [bz, us] = await Promise.all([api('/businesses'), api('/users')]);
      top = `<div class="card"><h3>Add a service</h3>${bz.some(b => b.status === 'verified') ? '' : '<p class="mut">You need a verified business first.</p>'}
      <form class="row" id="svf"><label>Business<select name="business_id">${bz.filter(b => b.status === 'verified').map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label>
      <label>Service name<input name="name" required></label><label>Price (₹)<input name="price" type="number" min="0" step="1" required></label><label>Location<input name="location" required></label>
      <label>Availability<input name="availability" placeholder="Mon-Sat 09:00-18:00"></label>
      <label>Provider<select name="provider_id"><option value="">-- none --</option>${us.map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label>
      <label>Description<input name="description"></label><button>Add</button></form></div>`;
    }
    const cols = [['ID', x => x.id], ['Service', x => esc(x.name)], ['Business', x => esc(x.business_name)], ['Category', x => esc(x.category)], ['Location', x => esc(x.location)],
      ['Price', x => money(x.price)], ['Availability', x => esc(x.availability)], ['Rating', x => x.avg_rating ? '★ ' + x.avg_rating : '-']];
    if (r === 'customer') cols.push(['', x => `<button class="s" onclick="bookForm(${x.id},'${esc(x.name).replace(/'/g, '')}')">Book</button>`]);
    if (r === 'owner') { cols.push(['Active', x => badge(x.active ? 'verified' : 'cancelled')]); cols.push(['Action', x => `<button class="s o" onclick="editPrice(${x.id},${x.price})">Price</button><button class="s ${x.active ? 'r' : 'g'}" onclick="toggleSvc(${x.id},${x.active})">${x.active ? 'Deactivate' : 'Activate'}</button>`]) }
    return `<h2>${r === 'customer' ? 'Find & Book Services' : 'Services'}</h2>${top}<div class="card">${table(cols, rows)}</div>`;
  },
  async bookings(){
    const rows = await api('/bookings'), r = user.role;
    const cols = [['ID', x => x.id], ['Service', x => esc(x.service_name)], ['Business', x => esc(x.business_name)], ['Customer', x => esc(x.customer_name)], ['When', x => x.date + ' ' + x.time],
      ['Amount', x => money(x.amount)], ['Status', x => badge(x.status)], ['Payment', x => badge(x.payment_status)]];
    cols.push(['Actions', x => {
      const open = x.status === 'pending' || x.status === 'confirmed';
      if (r === 'customer') return (open ? `<button class="s o" onclick="resched(${x.id})">Reschedule</button><button class="s r" onclick="setBk(${x.id},'cancelled')">Cancel</button>` : '') +
        (x.payment_status === 'unpaid' && x.status !== 'cancelled' ? `<button class="s g" onclick="payBk(${x.id})">Pay</button>` : '') +
        (x.status === 'completed' ? `<button class="s" onclick="rate(${x.id})">Review</button>` : '');
      return (x.status === 'pending' ? `<button class="s g" onclick="setBk(${x.id},'confirmed')">Confirm</button>` : '') + (x.status === 'confirmed' ? `<button class="s" onclick="setBk(${x.id},'completed')">Complete</button>` : '') + (open ? `<button class="s r" onclick="setBk(${x.id},'cancelled')">Cancel</button>` : '');
    }]);
    return `<h2>${r === 'customer' ? 'My Bookings' : r === 'provider' ? 'My Jobs' : 'Bookings'}</h2><div class="card">${table(cols, rows)}</div>`;
  },
  async payments(){
    const rows = await api('/payments');
    return `<h2>Payments</h2><div class="card">${table([['ID', x => x.id], ['Booking', x => x.booking_id], ['Service', x => esc(x.service_name)], ['Customer', x => esc(x.customer_name)], ['Amount', x => money(x.amount)], ['Method', x => esc(x.method)], ['Status', x => badge(x.status)], ['Date', x => x.created_at]], rows)}</div>`;
  },
  async reviews(){
    const rows = await api('/reviews');
    return `<h2>Customer Feedback</h2><div class="card">${table([['Customer', x => esc(x.customer_name)], ['Service', x => esc(x.service_name)], ['Business', x => esc(x.business_name)], ['Rating', x => '★'.repeat(x.rating)], ['Comment', x => esc(x.comment)], ['Date', x => x.created_at]], rows)}</div>`;
  },
  async reports(){
    return `<h2>Reports</h2><div class="card"><div class="bar-actions noprint"><select id="rn">
      <option value="business-registration">Business Registration Report</option><option value="service-booking">Service Booking Report</option>
      <option value="revenue">Revenue Report</option><option value="customer-feedback">Customer Feedback Report</option></select>
      <button onclick="loadReport()">View</button><button class="o" onclick="exportCsv()">Export CSV</button><button class="o" onclick="window.print()">Print</button></div><div id="rt"></div></div>`;
  },
  async users(){
    const rows = await api('/users');
    return `<h2>Users</h2><div class="card">${table([['ID', x => x.id], ['Name', x => esc(x.name)], ['Email', x => esc(x.email)], ['Role', x => badge(x.role)], ['Joined', x => x.created_at]], rows)}</div>`;
  }
};

const AFTER = {
  businesses(){ const f = $('#bf'); if (f) f.onsubmit = act(async e => { e.preventDefault(); const r = await api('/businesses', 'POST', Object.fromEntries(new FormData(e.target))); toast(r.message); reload() }) },
  services(){
    const s = $('#sf'); if (s) s.onsubmit = e => { e.preventDefault(); window.svcQ = Object.fromEntries(new FormData(e.target)); Object.keys(window.svcQ).forEach(k => !window.svcQ[k] && delete window.svcQ[k]); reload() };
    const f = $('#svf'); if (f) f.onsubmit = act(async e => { e.preventDefault(); const r = await api('/services', 'POST', Object.fromEntries(new FormData(e.target))); toast(r.message); reload() });
  },
  reports(){ loadReport() }
};

window.setBiz = act(async (id, st) => { await api(`/businesses/${id}/status`, 'PUT', {status: st}); toast('Business ' + st); reload() });
window.setBk = act(async (id, st) => { if (st === 'cancelled' && !confirm('Cancel this booking?')) return; await api(`/bookings/${id}/status`, 'PUT', {status: st}); toast('Booking ' + st); reload() });
window.toggleSvc = act(async (id, a) => { await api(`/services/${id}`, 'PUT', {active: a ? 0 : 1}); reload() });
window.editPrice = act(async (id, p) => { const v = prompt('New price (₹):', p); if (v === null) return; await api(`/services/${id}`, 'PUT', {price: v}); toast('Price updated'); reload() });
window.resched = act(async id => { const d = prompt('New date (YYYY-MM-DD):'); if (!d) return; const t = prompt('New time (HH:MM, 24h):', '10:00'); if (!t) return; await api(`/bookings/${id}/reschedule`, 'PUT', {date: d, time: t}); toast('Rescheduled'); reload() });
window.payBk = act(async id => { const m = prompt('Payment method (card / upi / netbanking / wallet):', 'upi'); if (!m) return; const r = await api(`/bookings/${id}/pay`, 'POST', {method: m.toLowerCase().trim()}); toast(r.message); reload() });
window.rate = act(async id => { const n = prompt('Rating 1-5:', '5'); if (!n) return; const c = prompt('Comment (optional):') || ''; const r = await api('/reviews', 'POST', {booking_id: id, rating: n, comment: c}); toast(r.message); reload() });
window.bookForm = (id, name) => {
  const tomorrow = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  $('#bk').innerHTML = `<div class="card"><h3>Book: ${esc(name)}</h3><form class="row" id="bkf"><label>Date<input type="date" name="date" min="${tomorrow}" value="${tomorrow}" required></label>
    <label>Time<input type="time" name="time" value="10:00" required></label><button>Confirm booking</button></form></div>`;
  $('#bkf').onsubmit = act(async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); d.service_id = id; const r = await api('/bookings', 'POST', d); toast(r.message); go('bookings') });
  $('#bk').scrollIntoView({behavior: 'smooth'});
};
window.loadReport = act(async () => {
  const rows = await api('/reports/' + $('#rn').value);
  $('#rt').innerHTML = rows.length ? table(Object.keys(rows[0]).map(k => [k, r => esc(r[k])]), rows) : '<p class="mut">No data for this report.</p>';
});
window.exportCsv = act(async () => {
  const n = $('#rn').value, r = await api(`/reports/${n}?format=csv`, 'GET', null, true), b = await r.blob(), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = n + '.csv'; a.click();
});
window.logout = logout; window.go = go; window.authScreen = authScreen;
start();
</script>
</body>
</html>
